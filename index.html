<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <header class="game-header">
        <h1>Simon Says</h1>
        <div class="score-container">
          <span class="score level">Level <b id="level">0</b></span>
          <span class="score best">🏆 Best <b id="best">0</b></span>
        </div>
      </header>
      <h2 id="status">Press any key to start</h2>
      <div class="btn-container">
        <div class="btn red" id="red"></div>
        <div class="btn green" id="green"></div>
        <div class="btn blue" id="blue"></div>
        <div class="btn yellow" id="yellow"></div>
      </div>
      <button class="start" id="start">Start</button>
    </main>
    <script src="app.js"></script>
  </body>
</html>
